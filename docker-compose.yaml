services:
  minio:
    image: minio/minio
    ports:
      - "59000:9000"
      - "59001:9001"
    volumes:
      - minio_storage:/data
    environment:
      MINIO_ROOT_USER: incredible
      MINIO_ROOT_PASSWORD: SuperSecretRootPwd
    command: server --console-address ":9001" /data

  studio-db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: incredible_studio
      POSTGRES_USER: incredible
      POSTGRES_PASSWORD: incredible
    ports:
      - '54329:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U incredible -d incredible_studio']
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - studio-db:/var/lib/postgresql/data

volumes:
  minio_storage: {}
  studio-db: {}
