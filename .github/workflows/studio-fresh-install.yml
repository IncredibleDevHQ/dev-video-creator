# The studio from a clean machine, as the README says to set it up: setup
# twice (the second run must find nothing new to do), the doctor, the unit
# tests, the desktop app's smoke on the durable store, and stub-harness
# checks of the bundled example and the page view. Stub checks prove the
# machinery, never what a model makes: live provider proofs are not run here.
name: Studio fresh install

on:
  pull_request:
    paths:
      - 'apps/studio-v2/**'
      - 'apps/studio-desktop/**'
      - 'packages/markdown-composition/**'
      - 'packages/node-identifier/**'
      - 'scripts/studio/**'
      - 'package.json'
      - 'yarn.lock'
      - 'docker-compose.yaml'
      - '.nvmrc'
      - '.github/workflows/studio-fresh-install.yml'
  workflow_dispatch:

concurrency:
  group: studio-fresh-install-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fresh-install:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Electron's sandbox needs privileges a CI runner does not grant.
      ELECTRON_DISABLE_SANDBOX: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: FFmpeg, and what Electron needs on Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg xvfb libnss3 libatk-bridge2.0-0 libgtk-3-0 libgbm1 libasound2t64

      - name: Setup, first run
        run: yarn studio:setup

      - name: Setup, second run finds nothing new to do
        run: |
          yarn studio:setup | tee second-run.txt
          grep -q 'none new' second-run.txt
          grep -q 'The studio front end: already built from these sources' second-run.txt
          grep -q 'The desktop app: already built from these sources' second-run.txt

      - name: Doctor
        run: yarn studio:doctor

      - name: Unit tests
        run: |
          yarn studio:test
          yarn workspace studio-v2 test

      - name: The desktop app on the durable store
        run: xvfb-run -a yarn workspace studio-desktop smoke

      - name: The bundled example, made once and found again (stub checks)
        run: xvfb-run -a node apps/studio-desktop/scripts/sample-check.mjs

      - name: The page view (stub checks)
        run: xvfb-run -a node apps/studio-desktop/scripts/page-view-check.mjs
