      <text x="920" y="503">Scale  ÷ √d_k</text>
      <rect x="820" y="400" width="200" height="36" rx="3" fill="#10284A" stroke="#F5A623" stroke-width="1.5" />
      <text x="920" y="423">Softmax</text>
      <rect x="820" y="320" width="200" height="36" rx="3" fill="#10284A" stroke="#9CC3E6" stroke-width="1.5" />
      <text x="920" y="343">MatMul  · V</text>
    </g>
    <g id="flow-edges" fill="none" stroke="#9CC3E6" stroke-width="1.5">
