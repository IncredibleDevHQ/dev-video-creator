    <text x="80" y="104" font-size="38" font-weight="bold" fill="#E8F1FA">Multi-head attention: eight views at once</text>
  </g>

  <g id="multihead-formula" data-pptx-replace-with="formula" data-pptx-x="80" data-pptx-y="150" data-pptx-width="1120" data-pptx-height="50" data-pptx-bounds="80 150 1120 50">
    <metadata type="application/json">
      {"latex":"\\mathrm{MultiHead}(Q,K,V)=\\mathrm{Concat}(\\mathrm{head}_1,\\ldots,\\mathrm{head}_h)W^{O}",
       "display":"block","font_size":22,"color":"#E8F1FA","align":"left"}
    </metadata>
    <text x="88" y="184" font-size="22" fill="#E8F1FA">MultiHead(Q, K, V) = Concat(head₁, …, head_h) Wᴼ</text>
  </g>
  <g id="head-formula" data-pptx-replace-with="formula" data-pptx-x="80" data-pptx-y="204" data-pptx-width="1120" data-pptx-height="50" data-pptx-bounds="80 204 1120 50">
    <metadata type="application/json">
      {"latex":"\\mathrm{head}_i=\\mathrm{Attention}(QW_i^{Q},\\,KW_i^{K},\\,VW_i^{V})",
       "display":"block","font_size":22,"color":"#E8F1FA","align":"left"}
    </metadata>
    <text x="88" y="238" font-size="22" fill="#E8F1FA">head_i = Attention(Q W_i^Q, K W_i^K, V W_i^V)</text>
  </g>

