  <g id="header" data-pptx-bounds="80 36 1120 84">
    <text x="82" y="58" font-family="Consolas" font-size="14" fill="#F5A623" letter-spacing="2">§ 03 · ATTENTION, STEP 4</text>
    <text x="80" y="104" font-size="38" font-weight="bold" fill="#E8F1FA">Injecting order without recurrence</text>
  </g>

  <g id="pe-sin-formula" data-pptx-replace-with="formula" data-pptx-x="80" data-pptx-y="150" data-pptx-width="580" data-pptx-height="64" data-pptx-bounds="80 150 580 64">
    <metadata type="application/json">
      {"latex":"PE_{(pos,\\,2i)}=\\sin\\left(pos/10000^{2i/d_{\\mathrm{model}}}\\right)",
       "display":"block","font_size":20,"color":"#E8F1FA","align":"left"}
    </metadata>
    <text x="88" y="190" font-size="20" fill="#E8F1FA">PE(pos, 2i) = sin( pos / 10000^(2i / d_model) )</text>
  </g>
  <g id="pe-cos-formula" data-pptx-replace-with="formula" data-pptx-x="80" data-pptx-y="216" data-pptx-width="580" data-pptx-height="64" data-pptx-bounds="80 216 580 64">
    <metadata type="application/json">
      {"latex":"PE_{(pos,\\,2i+1)}=\\cos\\left(pos/10000^{2i/d_{\\mathrm{model}}}\\right)",
       "display":"block","font_size":20,"color":"#E8F1FA","align":"left"}
    </metadata>
    <text x="88" y="256" font-size="20" fill="#E8F1FA">PE(pos, 2i+1) = cos( pos / 10000^(2i / d_model) )</text>
  </g>

  <g id="pe-facts" data-pptx-bounds="80 300 580 320">
    <line x1="80" y1="310" x2="80" y2="470" stroke="#F5A623" stroke-width="3" />
    <text x="104" y="334" font-size="20" font-weight="bold" fill="#E8F1FA">Why sinusoids, not learned positions?</text>
    <text fill="#C9DBEA" font-size="18" x="104" y="366">Learned positional embeddings performed nearly</text><text fill="#C9DBEA" font-size="18" x="104" y="394">identically in the ablation (Table 3).</text><text fill="#C9DBEA" font-size="18" x="104" y="422">The sinusoidal version was kept because it may</text><text fill="#C9DBEA" font-size="18" x="104" y="450">extrapolate to lengths never seen in training.</text><g id="pe-add-schematic">
      <rect x="104" y="510" width="170" height="40" rx="3" fill="#10284A" stroke="#9CC3E6" stroke-width="1.5" />
      <text x="189" y="535" font-size="14" fill="#E8F1FA" text-anchor="middle">Input Embedding</text>
      <text x="302" y="536" font-size="22" fill="#9CC3E6" text-anchor="middle">+</text>
      <rect x="330" y="510" width="170" height="40" rx="3" fill="#10284A" stroke="#F5A623" stroke-width="1.5" />
      <text x="415" y="535" font-size="14" fill="#E8F1FA" text-anchor="middle">Positional Encoding</text>
      <text x="530" y="536" font-size="22" fill="#9CC3E6" text-anchor="middle">=</text>
      <text x="560" y="535" font-family="Consolas" font-size="14" fill="#F5A623">d_model = 512</text>
      <text x="104" y="580" font-family="Consolas" font-size="13" fill="#9CB4CC">added, not concatenated — same width, no extra parameters</text>
    </g>
  </g>

