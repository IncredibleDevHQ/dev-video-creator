  <g id="pe-notes" data-pptx-bounds="700 470 500 156">
    <line x1="700" y1="476" x2="700" y2="600" stroke="#F5A623" stroke-width="3" />
    <text fill="#C9DBEA" font-size="17" x="724" y="500">Each dimension is a sinusoid with its own</text><text fill="#C9DBEA" font-size="17" x="724" y="526">wavelength, so a position gets a unique code.</text><text fill="#C9DBEA" font-size="17" x="724" y="552">For any fixed offset k, PE(pos+k) is a linear</text><text fill="#C9DBEA" font-size="17" x="724" y="578">function of PE(pos): relative offsets are easy.</text></g>

