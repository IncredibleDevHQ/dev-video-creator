  <g id="lrate-formula" data-pptx-replace-with="formula" data-pptx-x="670" data-pptx-y="268" data-pptx-width="520" data-pptx-height="60" data-pptx-bounds="670 268 520 60">
    <metadata type="application/json">
      {"latex":"lrate=d_{\\mathrm{model}}^{-0.5}\\cdot\\min\\left(step^{-0.5},\\;step\\cdot warmup\\_steps^{-1.5}\\right)",
       "display":"block","font_size":15,"color":"#E8F1FA","align":"left"}
    </metadata>
    <text x="670" y="304" font-size="15" fill="#E8F1FA">lrate = d_model⁻⁰·⁵ · min(step⁻⁰·⁵, step·warmup_steps⁻¹·⁵)</text>
  </g>

