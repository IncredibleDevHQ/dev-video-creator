  <g id="header" data-pptx-bounds="80 36 1120 84">
    <text x="82" y="58" font-family="Consolas" font-size="14" fill="#F5A623" letter-spacing="2">§ 01 · THE BOTTLENECK</text>
    <text x="80" y="104" font-size="38" font-weight="bold" fill="#E8F1FA">Before 2017, models paid for word order with time</text>
  </g>

  <g id="recurrent-panel" data-pptx-bounds="80 150 560 380">
    <rect x="80" y="150" width="560" height="380" fill="none" stroke="#3C5A80" stroke-width="1" />
    <text x="100" y="180" font-family="Consolas" font-size="14" fill="#9CC3E6" letter-spacing="2">A · RECURRENT (LSTM / GRU)</text>
    <text x="100" y="228" font-family="Consolas" font-size="17" fill="#9CB4CC">h<tspan baseline-shift="sub" font-size="12">t</tspan> = f(h<tspan baseline-shift="sub" font-size="12">t−1</tspan>, x<tspan baseline-shift="sub" font-size="12">t</tspan>)   — every step waits for the previous one</text>
    <g id="recurrent-chain">
      <circle cx="140" cy="320" r="18" fill="#10284A" stroke="#9CC3E6" stroke-width="1.5" />
      <circle cx="230" cy="320" r="18" fill="#10284A" stroke="#9CC3E6" stroke-width="1.5" />
      <circle cx="320" cy="320" r="18" fill="#10284A" stroke="#9CC3E6" stroke-width="1.5" />
      <circle cx="410" cy="320" r="18" fill="#10284A" stroke="#9CC3E6" stroke-width="1.5" />
      <circle cx="500" cy="320" r="18" fill="#10284A" stroke="#9CC3E6" stroke-width="1.5" />
      <circle cx="590" cy="320" r="18" fill="#10284A" stroke="#F5A623" stroke-width="2" />
      <line x1="158" y1="320" x2="210" y2="320" stroke="#9CC3E6" stroke-width="1.5" marker-end="url(#arrowLine)" />
      <line x1="248" y1="320" x2="300" y2="320" stroke="#9CC3E6" stroke-width="1.5" marker-end="url(#arrowLine)" />
      <line x1="338" y1="320" x2="390" y2="320" stroke="#9CC3E6" stroke-width="1.5" marker-end="url(#arrowLine)" />
      <line x1="428" y1="320" x2="480" y2="320" stroke="#9CC3E6" stroke-width="1.5" marker-end="url(#arrowLine)" />
      <line x1="518" y1="320" x2="570" y2="320" stroke="#9CC3E6" stroke-width="1.5" marker-end="url(#arrowLine)" />
      <text x="140" y="326" font-family="Consolas" font-size="14" fill="#E8F1FA" text-anchor="middle">1</text>
      <text x="230" y="326" font-family="Consolas" font-size="14" fill="#E8F1FA" text-anchor="middle">2</text>
      <text x="320" y="326" font-family="Consolas" font-size="14" fill="#E8F1FA" text-anchor="middle">3</text>
      <text x="410" y="326" font-family="Consolas" font-size="14" fill="#E8F1FA" text-anchor="middle">4</text>
      <text x="500" y="326" font-family="Consolas" font-size="14" fill="#E8F1FA" text-anchor="middle">5</text>
      <text x="590" y="326" font-family="Consolas" font-size="14" fill="#F5A623" text-anchor="middle">n</text>
    </g>
    <g id="recurrent-dimension">
      <line x1="140" y1="380" x2="590" y2="380" stroke="#9CC3E6" stroke-width="1" stroke-dasharray="8,4,2,4" />
      <line x1="140" y1="372" x2="140" y2="388" stroke="#9CC3E6" stroke-width="1" />
      <line x1="590" y1="372" x2="590" y2="388" stroke="#9CC3E6" stroke-width="1" />
      <text x="365" y="408" font-family="Consolas" font-size="14" fill="#9CC3E6" text-anchor="middle">n SEQUENTIAL STEPS · PATH LENGTH O(n)</text>
    </g>
    <text fill="#C9DBEA" font-size="19" x="100" y="458">Position 1 reaches position n only through n hops.</text><text fill="#C9DBEA" font-size="19" x="100" y="486">Inside one example nothing can run in parallel,</text><text fill="#C9DBEA" font-size="19" x="100" y="514">so longer sentences mean longer wall-clock time.</text></g>

