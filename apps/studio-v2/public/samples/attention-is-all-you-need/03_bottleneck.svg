      <circle cx="1050" cy="280" r="8" fill="#10284A" stroke="#9CC3E6" stroke-width="1.5" />
      <circle cx="930" cy="224" r="10" fill="#10284A" stroke="#F5A623" stroke-width="2" />
    </g>
    <g id="conv-dimension">
      <line x1="1170" y1="224" x2="1170" y2="400" stroke="#9CC3E6" stroke-width="1" stroke-dasharray="8,4,2,4" />
      <line x1="1162" y1="224" x2="1178" y2="224" stroke="#9CC3E6" stroke-width="1" />
      <line x1="1162" y1="400" x2="1178" y2="400" stroke="#9CC3E6" stroke-width="1" />
      <text x="1160" y="318" font-family="Consolas" font-size="13" fill="#9CC3E6" text-anchor="end">O(log<tspan baseline-shift="sub" font-size="10">k</tspan> n)</text>
    </g>
    <text fill="#C9DBEA" font-size="19" x="680" y="458">Parallel inside a layer, but two distant positions</text><text fill="#C9DBEA" font-size="19" x="680" y="486">only meet after a stack of kernel-k layers —</text><text fill="#C9DBEA" font-size="19" x="680" y="514">the path shrinks to O(log n), it does not vanish.</text></g>

  <g id="distance-tax" data-pptx-bounds="80 548 1120 100">
    <line x1="80" y1="548" x2="80" y2="640" stroke="#F5A623" stroke-width="3" />
    <text fill="#E8F1FA" x="104" y="574"><tspan>Both architectures charge a <tspan fill="#F5A623" font-weight="bold">distance tax</tspan>: the farther apart two positions are,</tspan></text><text fill="#E8F1FA" x="104" y="604">the longer the path a signal must travel — and recurrence cannot run in parallel</text><text fill="#E8F1FA" x="104" y="634">within one training example. The paper's question: what if every path had length 1?</text></g>

