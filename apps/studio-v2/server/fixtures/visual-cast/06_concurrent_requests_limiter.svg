        <rect x="428" y="250" width="14" height="42" rx="2"/><rect x="456" y="250" width="14" height="42" rx="2"/><rect x="484" y="250" width="14" height="42" rx="2" data-anim="blink" data-anim-order="2"/><rect x="512" y="250" width="14" height="42" rx="2"/><rect x="540" y="250" width="14" height="42" rx="2"/><rect x="568" y="250" width="14" height="42" rx="2"/>
